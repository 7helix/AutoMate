name: Build AutoMate APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships the Android SDK. We only make sure licenses are accepted
      # and the needed platform is present (no setup-android action: its "tools" install fails).
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Check docs referenced by the app exist
        run: |
          grep -o '"[a-z]*/[0-9a-z-]*\.md"' app/src/main/java/com/automate/app/data/Docs.kt | tr -d '"' | while read -r f; do
            test -f "docs/$f" || { echo "Missing docs/$f"; exit 1; }
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoMate-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AutoMate-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoMate-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
